
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Project-Teams</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: white;
            color: #333;
            min-height: 100vh;
        }

        /* =========================
           TOP NAVIGATION
        ========================= */

        .navbar {
            width: 100%;
            height: 75px;
            background: #4DBFFF;
            display: flex;
            align-items: center;
            padding: 0 50px;
        }

        .search-container {
            position: relative;
            width: 500px;
            max-width: 60%;
        }

        .search-container input {
            width: 100%;
            height: 42px;
            border: none;
            border-radius: 22px;
            background: white;
            padding: 0 50px 0 20px;
            font-size: 16px;
            outline: none;
            margin-bottom: 0;
        }

        .search-container i {
            position: absolute;
            right: 18px;
            top: 13px;
            color: #555;
            font-size: 17px;
        }

        .profile {
            margin-left: auto;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #4DBFFF;
            font-size: 22px;
        }

        /* =========================
           PAGE
        ========================= */

        .page {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 55px 20px 70px;
        }

        /* =========================
           LOGO
        ========================= */

        .logo {
            color: #4DBFFF;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .logo i {
            margin: 0 -7px;
        }

        /* =========================
           TITLE
        ========================= */

        .page-title {
            color: #4DBFFF;
            font-size: 38px;
            margin-bottom: 8px;
            text-align: center;
        }

        .subtitle {
            color: #666;
            font-size: 17px;
            text-align: center;
            margin-bottom: 30px;
        }

        /* =========================
           LOGIN CARD
        ========================= */

        .card {
            width: 420px;
            max-width: 100%;
            background: white;
            border: 2px solid #e5f5ff;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(77, 191, 255, 0.15);
        }

        /* =========================
           FORM
        ========================= */

        form {
            width: 100%;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
            color: #444;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 14px;
            color: #4DBFFF;
        }

        .input-group input {
            width: 100%;
            padding: 13px 14px 13px 43px;
            border: 1px solid #d8d8d8;
            border-radius: 9px;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            margin-bottom: 0;
        }

        .input-group input:focus {
            border-color: #4DBFFF;
            box-shadow: 0 0 0 3px rgba(77, 191, 255, 0.15);
        }

        /* =========================
           LOGIN BUTTON
        ========================= */

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #4DBFFF;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 5px;
        }

        button:hover {
            background: #28AFFF;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(77, 191, 255, 0.25);
        }

        /* =========================
           ERROR MESSAGE
        ========================= */

        .error {
            color: #e74c3c;
            background: #fff1f0;
            border: 1px solid #ffc9c5;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

        /* =========================
           CREATE ACCOUNT LINK
        ========================= */

        .bottom {
            text-align: center;
            margin-top: 24px;
            color: #666;
            font-size: 15px;
        }

        .bottom a {
            color: #4DBFFF;
            text-decoration: none;
            font-weight: bold;
        }

        .bottom a:hover {
            text-decoration: underline;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .navbar {
                padding: 0 20px;
            }

            .search-container {
                max-width: 75%;
            }

            .page {
                padding-top: 35px;
            }

            .page-title {
                font-size: 32px;
            }

            .card {
                padding: 28px 22px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         TOP NAVIGATION
    ========================= -->

    <nav class="navbar">

        <div class="search-container">

            <input
                type="text"
                placeholder="Search Project-Teams..."
            >

            <i class="fa-solid fa-magnifying-glass"></i>

        </div>


        <div class="profile">

            <i class="fa-solid fa-user"></i>

        </div>

    </nav>


    <!-- =========================
         LOGIN PAGE
    ========================= -->

    <main class="page">


        <!-- Three Person Logo -->

        <div class="logo">

            <i class="fa-solid fa-user"></i>
            <i class="fa-solid fa-user"></i>
            <i class="fa-solid fa-user"></i>

        </div>


        <!-- Title -->

        <h1 class="page-title">
            Welcome Back
        </h1>

        <p class="subtitle">
            Log in to your Project-Teams account.
        </p>


        <!-- Login Card -->

        <div class="card">

            <form method="POST">

                {% csrf_token %}


                {% if error %}

                    <div class="error">
                        {{ error }}
                    </div>

                {% endif %}


                <!-- Username -->

                <label>
                    Username
                </label>

                <div class="input-group">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <!-- Password -->

                <label>
                    Password
                </label>

                <div class="input-group">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- Login -->

                <button type="submit">
                    Log In
                </button>

            </form>


            <!-- Create Account -->

            <div class="bottom">

                Don't have an account?

                <a href="/register/">
                    Create Account
                </a>

            </div>

        </div>

    </main>


</body>
</html>
```
