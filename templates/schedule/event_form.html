{% extends "base.html" %}

{% block title %}Add Event | TeamSpace{% endblock %}

{% block content %}

<div class="page-header">
    <h1>Add Event</h1>
</div>

<div class="card form-card">

    {% if error %}<div class="error-box">{{ error }}</div>{% endif %}

    <form method="post">
        {% csrf_token %}

        <div class="field">
            <label for="id_title">Title</label>
            <input id="id_title" type="text" name="title" required>
        </div>

        <div class="field-row">
            <div class="field">
                <label for="id_date">Date</label>
                <input id="id_date" type="date" name="date" required>
            </div>
            <div class="field">
                <label for="id_time">Time</label>
                <input id="id_time" type="time" name="time" value="09:00">
            </div>
        </div>

        <div class="field">
            <label for="id_project">Project (optional, members will see it)</label>
            <select id="id_project" name="project">
                <option value="">Just for me</option>
                {% for p in projects %}
                    <option value="{{ p.id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="field">
            <label for="id_description">Description</label>
            <textarea id="id_description" name="description"></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Add Event</button>
    </form>

</div>

{% endblock %}
